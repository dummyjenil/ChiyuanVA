name: Publish Release (AAR & JAR)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Install NDK / SDK Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Set up Gradle Build Cache & Daemon
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Black Reflection JAR & Bcore Release AAR
        run: |
          ./gradlew :black-reflection:jar :Bcore:assembleRelease --stacktrace --no-daemon

      - name: Stage Release Artifacts & Generate Checksums
        run: |
          mkdir -p release-assets
          
          # Copy generated AAR and JAR
          find Bcore/build/outputs/aar/ -type f -name "*.aar" -exec cp {} release-assets/ \;
          find black-reflection/build/libs/ -type f -name "*.jar" -exec cp {} release-assets/ \;
          
          # Generate SHA256 checksums
          cd release-assets
          sha256sum * > checksums.txt
          echo "=== Staged Release Files ==="
          ls -la
          cat checksums.txt

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: chiyuan-va-release-binaries
          path: release-assets/*
          if-no-files-found: error

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
